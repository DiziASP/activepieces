name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Lowercase repository owner
        run: |
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/activepieces-app:${{ github.event.inputs.tag }}
            ghcr.io/${{ env.REPO_OWNER }}/activepieces-app:latest
          build-args: |
            AP_CONTAINER_TYPE=APP

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/activepieces-worker:${{ github.event.inputs.tag }}
            ghcr.io/${{ env.REPO_OWNER }}/activepieces-worker:latest
          build-args: |
            AP_CONTAINER_TYPE=WORKER

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Lowercase repository owner
        run: |
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Sync deployment files
        run: |
          mkdir -p ~/activepieces
          cp deploy/docker-compose.prod.yml ~/activepieces/
          cp deploy/Caddyfile ~/activepieces/

      - name: Pull latest images
        run: |
          export TAG=${{ github.event.inputs.tag }}
          export GITHUB_REPOSITORY_OWNER=${{ env.REPO_OWNER }}
          cd ~/activepieces
          docker compose -f docker-compose.prod.yml pull

      - name: Deploy containers
        run: |
          export TAG=${{ github.event.inputs.tag }}
          export GITHUB_REPOSITORY_OWNER=${{ env.REPO_OWNER }}
          export AP_DOMAIN=${{ secrets.AP_DOMAIN }}
          cd ~/activepieces
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Health check
        run: |
          sleep 30
          curl -f http://localhost:8080/api/v1/health || exit 1
